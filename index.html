<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>成交数据管理</title>
<style>
  :root {
    --primary: #1a73e8; --success: #0d9488; --warning: #f59e0b; --danger: #ef4444;
    --bg: #f1f5f9; --card: #ffffff; --text: #1e293b; --text2: #64748b;
    --border: #e2e8f0; --shadow: 0 1px 3px rgba(0,0,0,.08); --radius: 10px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

  .header{
    background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);color:#fff;
    padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 8px rgba(0,0,0,.15);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px;
  }
  .header h1{font-size:1.1rem;font-weight:600}
  .header .status{font-size:.7rem;opacity:.9;display:flex;align-items:center;gap:4px}
  .header .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
  .dot.online{background:#4ade80} .dot.offline{background:#f87171} .dot.loading{background:#fbbf24;animation:pulse .8s infinite}
  @keyframes pulse{50%{opacity:.4}}

  .container{max-width:1400px;margin:0 auto;padding:16px}
  .grid{display:grid;grid-template-columns:400px 1fr;gap:16px}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}

  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;border:1px solid var(--border);margin-bottom:14px}
  .card-title{font-size:.9rem;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}

  #pasteInput{
    width:100%;min-height:200px;resize:vertical;border:2px dashed var(--border);
    border-radius:8px;padding:12px;font-size:.85rem;font-family:inherit;line-height:1.7;
    background:#fafbfc;transition:border-color .2s;
  }
  #pasteInput:focus{outline:none;border-color:var(--primary);background:#fff}

  .btn-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:4px;padding:8px 15px;
    border:none;border-radius:7px;font-size:.82rem;font-weight:500;cursor:pointer;
    transition:all .15s;white-space:nowrap;font-family:inherit;
  }
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:#1557b0}
  .btn-success{background:var(--success);color:#fff}
  .btn-warning{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
  .btn-danger{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
  .btn-outline{background:#fff;color:var(--text);border:1px solid var(--border)}
  .btn-sm{padding:5px 10px;font-size:.75rem;border-radius:5px}

  .stats-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .stat{flex:1;min-width:80px;background:var(--card);border-radius:8px;padding:10px 14px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border)}
  .stat .num{font-size:1.4rem;font-weight:700;color:var(--primary)}
  .stat .lbl{font-size:.7rem;color:var(--text2);margin-top:2px}

  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.8rem}
  th{background:#f1f5f9;padding:8px 10px;text-align:left;font-weight:600;color:var(--text2);white-space:nowrap;border-bottom:2px solid var(--border);position:sticky;top:0}
  td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
  tr:hover td{background:#f8fafc}
  .tag-duplicate{display:inline-block;background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:4px;font-size:.68rem;margin-left:4px}

  .toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
  #searchInput{flex:1;min-width:150px;padding:7px 12px;border:1px solid var(--border);border-radius:7px;font-size:.83rem;font-family:inherit}
  #searchInput:focus{outline:none;border-color:var(--primary)}

  .broadcast-list{display:flex;flex-direction:column;gap:8px}
  .broadcast-card{
    background:linear-gradient(135deg,#f0f9ff 0%,#faf5ff 100%);
    border:1px solid #e0e7ff;border-radius:10px;padding:12px 15px;font-size:.8rem;line-height:1.7;
  }
  .broadcast-card .line{display:flex;gap:4px}
  .broadcast-card .key{color:var(--text2);min-width:55px}
  .broadcast-card .val{color:var(--text);font-weight:500}
  .broadcast-card .price-tag{display:inline-block;background:#dcfce7;color:#166534;padding:2px 8px;border-radius:4px;font-weight:700;font-size:.85rem}

  .toast{
    position:fixed;top:16px;right:16px;z-index:9999;background:#1e293b;color:#fff;
    padding:11px 18px;border-radius:8px;font-size:.82rem;opacity:0;
    transform:translateY(-10px);transition:all .25s;pointer-events:none;max-width:350px;
  }
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.success{background:#059669}
  .toast.warn{background:#d97706}

  .history-popup{
    position:fixed;inset:0;background:rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;z-index:200;
    opacity:0;pointer-events:none;transition:opacity .2s;
  }
  .history-popup.open{opacity:1;pointer-events:auto}
  .history-popup .popup-inner{background:#fff;border-radius:12px;padding:22px;max-width:480px;width:92%;max-height:65vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .history-popup h3{margin-bottom:12px}
  .history-popup .close{float:right;background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text2)}

  .view-toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden}
  .view-toggle button{padding:6px 14px;border:none;background:#fff;cursor:pointer;font-size:.8rem;font-family:inherit}
  .view-toggle button.active{background:var(--primary);color:#fff}

  .empty{text-align:center;padding:40px 16px;color:var(--text2)}
  .empty .big{font-size:2.5rem;margin-bottom:6px}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div>
    <h1>📋 成交数据管理 <span style="font-size:.6rem;opacity:.6">v2.1</span></h1>
    <span class="status"><span class="dot loading" id="connDot"></span><span id="connText">检测连接...</span></span>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn btn-sm btn-success" onclick="exportCSV()">📥 导出CSV</button>
    <button class="btn btn-sm btn-outline" style="color:#fff;border-color:rgba(255,255,255,.3)" onclick="syncFromCloud()">🔄 刷新</button>
  </div>
</div>

<div class="container">
  <!-- STATS -->
  <div class="stats-row">
    <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">总成交数</div></div>
    <div class="stat"><div class="num" id="statMonth">0</div><div class="lbl">本月成交</div></div>
    <div class="stat"><div class="num" id="statAvg">--</div><div class="lbl">成交均价(万)</div></div>
    <div class="stat"><div class="num" id="statUpdated">0</div><div class="lbl">更新次数</div></div>
  </div>

  <div class="grid">
    <!-- LEFT -->
    <div>
      <div class="card">
        <div class="card-title">📝 粘贴成交播报</div>
        <textarea id="pasteInput" placeholder="在此粘贴成交播报文本，支持多条批量粘贴&#10;&#10;格式示例：&#10;成交播报&#10;楼盘:星澜之城2-523&#10;面积：54.51&#10;挂牌价: 138万&#10;成交价: 122万&#10;成交公司:贝壳德佑&#10;成交时间：2026.6.11&#10;房源编号：103147774694"></textarea>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="parseAndSave()" id="btnParse">🔍 解析并录入</button>
          <button class="btn btn-outline" onclick="document.getElementById('pasteInput').value=''">✕ 清空</button>
          <button class="btn btn-outline" onclick="loadDemo()">📋 填入示例</button>
        </div>
        <div id="parseLog" style="margin-top:8px;font-size:.75rem;color:var(--text2);display:none"></div>
      </div>
      <div class="card">
        <div class="card-title">📢 最近成交播报</div>
        <div class="broadcast-list" id="broadcastList"><div class="empty"><div class="big">📭</div>暂无成交记录</div></div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="card">
      <div class="card-title" style="justify-content:space-between">
        <span>📊 成交数据表</span>
        <div class="view-toggle">
          <button class="active" onclick="switchView('table',this)">📋 表格</button>
          <button onclick="switchView('cards',this)">🃏 卡片</button>
        </div>
      </div>
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="🔍 搜索楼盘/编号/维护人..." oninput="renderAll()">
        <span style="font-size:.75rem;color:var(--text2)" id="resultCount"></span>
      </div>
      <div class="table-wrap" id="tableView"><table><thead><tr><th>房源编号</th><th>楼盘</th><th>面积</th><th>装修</th><th>维护人</th><th>挂牌价</th><th>成交价</th><th>成交公司</th><th>成交时间</th><th>操作</th></tr></thead><tbody id="tableBody"></tbody></table></div>
      <div id="cardsView" style="display:none"><div class="broadcast-list" id="cardsList"></div></div>
    </div>
  </div>
</div>

<!-- HISTORY POPUP -->
<div class="history-popup" id="historyPopup">
  <div class="popup-inner">
    <button class="close" onclick="closeHistory()">✕</button>
    <h3>📜 价格变动历史</h3>
    <div id="historyContent"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ==================== SUPABASE REST API ====================
const SUPABASE_URL = 'https://nyhkczxlzpsyecsnscgt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_7iCQ17nrZVSDYfZKMP3TXQ_mQUpw8Sm';

let records = [];
let connected = false;

// Generic REST API call
async function api(method, path, body) {
  const url = SUPABASE_URL + path;
  const headers = {
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY
  };
  if (method === 'POST' || method === 'PATCH') {
    headers['Content-Type'] = 'application/json';
    headers['Prefer'] = 'return=representation';
  }

  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);

  try {
    const res = await fetch(url, opts);
    if (!res.ok) {
      const err = await res.text();
      throw new Error(method + ' ' + path + ' → ' + res.status + ': ' + err);
    }
    const text = await res.text();
    return text ? JSON.parse(text) : [];
  } catch(e) {
    if (e.message.includes('Failed to fetch') || e.message.includes('NetworkError')) {
      setConnected(false);
      throw new Error('网络连接失败，请检查网络后点🔄刷新');
    }
    throw e;
  }
}

// ==================== DATA LAYER ====================
async function loadAllData() {
  try {
    const data = await api('GET', '/rest/v1/transactions?select=*&order=date.desc');
    records = data || [];
    setConnected(true);
    console.log('✅ 从云端加载了 ' + records.length + ' 条记录');
  } catch(e) {
    console.error('加载失败:', e.message);
    setConnected(false);
  }
  renderAll();
}

async function saveRecord(record) {
  // Check if exists by property_id
  const existing = await api('GET', '/rest/v1/transactions?property_id=eq.' + encodeURIComponent(record.property_id) + '&select=id');
  if (existing && existing.length > 0) {
    // Update existing
    return await api('PATCH', '/rest/v1/transactions?property_id=eq.' + encodeURIComponent(record.property_id), record);
  } else {
    // Insert new
    return await api('POST', '/rest/v1/transactions', record);
  }
}

async function deleteFromDB(propertyId) {
  return await api('DELETE', '/rest/v1/transactions?property_id=eq.' + encodeURIComponent(propertyId));
}

function setConnected(val) {
  connected = val;
  const dot = document.getElementById('connDot');
  const txt = document.getElementById('connText');
  if (val) {
    dot.className = 'dot online';
    txt.textContent = '☁️ 云端已连接';
  } else {
    dot.className = 'dot offline';
    txt.textContent = '⚠️ 连接失败，点🔄刷新';
  }
}

async function checkConnection() {
  if (connected) return true;
  try {
    await api('GET', '/rest/v1/transactions?select=id&limit=1');
    setConnected(true);
    return true;
  } catch(e) {
    setConnected(false);
    return false;
  }
}

async function syncFromCloud() {
  document.getElementById('connDot').className = 'dot loading';
  document.getElementById('connText').textContent = '同步中...';
  await loadAllData();
  toast('已刷新 ' + records.length + ' 条记录', 'success');
}

// ==================== PARSER ====================
function parseBroadcast(text) {
  const t = text.replace(/：/g, ':');
  const blocks = t.split(/成交播报/i).filter(b => b.trim());
  const results = [];

  function extract(block) {
    const entry = {};
    const patterns = {
      building: /(?:地址|楼盘地址|楼盘名称|楼盘)\s*[:：]\s*(.+)/i,
      room: /房号\s*[:：]\s*(.+)/i,
      area: /面积\s*[:：]\s*(.+)/i,
      decoration: /装修\s*[:：]\s*(.+)/i,
      maintainer: /维护人\s*[:：]\s*(.+)/i,
      listingPrice: /(?:挂价|挂牌价格|挂牌价)\s*[:：]\s*(.+)/i,
      transactionPrice: /(?:成交价格|成交价)\s*[:：]\s*(.+)/i,
      company: /(?:成交公司|公司)\s*[:：]\s*(.+)/i,
      date: /(?:成交时间|成交日期|成交时间)\s*[:：]\s*(.+)/i,
      propertyId: /房源编号\s*[:：]\s*(.+)/i,
    };
    // Combine building + room number if both exist
    if (entry.building && entry.room) {
      entry.building = entry.building + entry.room;
    }
    for (const [key, regex] of Object.entries(patterns)) {
      const match = block.match(regex);
      if (match) entry[key] = match[1].trim();
    }
    return entry;
  }

  for (const block of blocks) {
    const entry = extract(block);
    if (entry.propertyId || entry.building) results.push(entry);
  }

  if (results.length === 0 && text.trim()) {
    const entry = extract(text);
    if (entry.propertyId || entry.building) results.push(entry);
  }

  return results;
}

async function parseAndSave() {
  const btn = document.getElementById('btnParse');
  const log = document.getElementById('parseLog');

  const input = document.getElementById('pasteInput').value.trim();
  if (!input) { toast('请先粘贴成交播报文本', 'warn'); return; }

  const parsed = parseBroadcast(input);
  log.style.display = 'block';
  log.innerHTML = '📋 识别到 <b>' + parsed.length + '</b> 条数据';

  if (parsed.length === 0) {
    log.innerHTML = '❌ 未识别到成交数据，请检查格式（楼盘/房源编号等字段）';
    toast('未识别到数据，请检查格式', 'warn');
    return;
  }

  // Show parsed preview
  parsed.forEach((p, i) => {
    log.innerHTML += '  <br>[' + (i+1) + '] 楼盘=' + (p.building || '?') + ' 编号=' + (p.propertyId || '?') + ' 成交价=' + (p.transactionPrice || '?');
  });

  btn.disabled = true;
  btn.textContent = '⏳ 录入中...';

  let newCount = 0, updateCount = 0;
  const now = new Date().toISOString();

  for (const entry of parsed) {
    const extractNum = (str) => {
      if (!str) return null;
      const cleaned = str.replace(/[^0-9.]/g, '');
      const num = parseFloat(cleaned);
      return isNaN(num) ? null : num;
    };

    const area = extractNum(entry.area);
    const listingPrice = extractNum(entry.listingPrice);
    const transactionPrice = extractNum(entry.transactionPrice);
    const listingPriceRaw = entry.listingPrice || null;
    const transactionPriceRaw = entry.transactionPrice || null;

    // Check if exists locally
    const existing = records.find(r => entry.propertyId && r.property_id === entry.propertyId);

    try {
      if (existing) {
        let priceHistory = existing.price_history || [];
        if (existing.transaction_price !== transactionPrice && transactionPrice) {
          priceHistory.push({
            price: existing.transaction_price_raw || (existing.transaction_price ? existing.transaction_price + '万' : ''),
            date: existing.date,
            recordedAt: existing.updated_at || existing.created_at
          });
        }

        const updated = {
          building: entry.building || existing.building,
          area: area || existing.area,
          decoration: entry.decoration || existing.decoration || '',
          maintainer: entry.maintainer || existing.maintainer || '',
          listing_price: listingPrice || existing.listing_price,
          listing_price_raw: listingPriceRaw || existing.listing_price_raw,
          transaction_price: transactionPrice || existing.transaction_price,
          transaction_price_raw: transactionPriceRaw || existing.transaction_price_raw,
          company: entry.company || existing.company || '',
          date: entry.date || existing.date || '',
          property_id: entry.propertyId || existing.property_id,
          price_history: priceHistory,
          update_count: (existing.update_count || 0) + 1,
          updated_at: now
        };
        await saveRecord(updated);
        updateCount++;
      } else {
        const record = {
          property_id: entry.propertyId || '',
          building: entry.building || '',
          area: area || null,
          decoration: entry.decoration || '',
          maintainer: entry.maintainer || '',
          listing_price: listingPrice || null,
          listing_price_raw: listingPriceRaw || null,
          transaction_price: transactionPrice || null,
          transaction_price_raw: transactionPriceRaw || null,
          company: entry.company || '',
          date: entry.date || '',
          price_history: [],
          update_count: 0,
          created_at: now,
          updated_at: now
        };
        await saveRecord(record);
        newCount++;
      }
    } catch(e) {
      console.error('保存失败:', e);
      log.innerHTML += '<br>❌ 保存失败: ' + e.message;
    }
  }

  await loadAllData();
  document.getElementById('pasteInput').value = '';

  const msg = [];
  if (newCount) msg.push('新增 ' + newCount + ' 条');
  if (updateCount) msg.push('更新 ' + updateCount + ' 条');
  log.innerHTML += '<br>✅ 完成！' + (msg.length ? msg.join('，') : '无变化');
  if (msg.length) toast(msg.join('，') + ' → 已同步 ☁️', 'success');

  btn.disabled = false;
  btn.textContent = '🔍 解析并录入';
}

// ==================== DELETE ====================
async function deleteRecord(propertyId) {
  if (!confirm('确定删除该条成交记录？')) return;
  try {
    await deleteFromDB(propertyId);
    await loadAllData();
    toast('已删除并同步', 'warn');
  } catch(e) {
    toast('删除失败: ' + e.message, 'warn');
  }
}

// ==================== RENDER ====================
function getFiltered() {
  const q = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  if (!q) return records;
  return records.filter(r =>
    (r.building || '').toLowerCase().includes(q) ||
    (r.property_id || '').toLowerCase().includes(q) ||
    (r.maintainer || '').toLowerCase().includes(q) ||
    (r.company || '').toLowerCase().includes(q)
  );
}

function renderAll() {
  renderTable();
  renderBroadcasts();
  renderCards();
  updateStats();
}

function renderTable() {
  const filtered = getFiltered();
  const tbody = document.getElementById('tableBody');
  document.getElementById('resultCount').textContent = '共 ' + filtered.length + ' 条';

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:40px;color:var(--text2)">暂无数据，请在左侧粘贴成交播报</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(r => {
    const hasHistory = r.price_history && r.price_history.length > 0;
    const updateBadge = r.update_count > 0 ? '<span class="tag-duplicate">更新' + r.update_count + '次</span>' : '';
    const showListing = r.listing_price_raw && r.listing_price_raw !== String(r.listing_price)
      ? esc(r.listing_price_raw) : (r.listing_price ? r.listing_price + '万' : '--');
    const showTransaction = r.transaction_price_raw && r.transaction_price_raw !== String(r.transaction_price)
      ? esc(r.transaction_price_raw) : (r.transaction_price ? r.transaction_price + '万' : '--');

    return '<tr>' +
      '<td><code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:.75rem">' + esc(r.property_id || '--') + '</code></td>' +
      '<td><strong>' + esc(r.building || '--') + '</strong></td>' +
      '<td>' + (r.area ? r.area + '㎡' : '--') + '</td>' +
      '<td>' + esc(r.decoration || '--') + '</td>' +
      '<td>' + esc(r.maintainer || '--') + '</td>' +
      '<td>' + (r.listing_price ? '<span style="color:var(--text2)">' + showListing + '</span>' : '--') + '</td>' +
      '<td><strong style="color:#059669">' + showTransaction + '</strong>' + updateBadge + '</td>' +
      '<td>' + esc(r.company || '--') + '</td>' +
      '<td>' + esc(r.date || '--') + '</td>' +
      '<td style="display:flex;gap:4px">' +
        '<button class="btn btn-sm btn-warning" onclick="showHistory(\'' + r.id + '\')" ' + (hasHistory ? '' : 'disabled') + '>📜</button>' +
        '<button class="btn btn-sm btn-danger" onclick="deleteRecord(\'' + esc(r.property_id) + '\')">✕</button>' +
      '</td></tr>';
  }).join('');
}

function renderBroadcasts() {
  const container = document.getElementById('broadcastList');
  const latest = records.slice(0, 5);
  if (latest.length === 0) {
    container.innerHTML = '<div class="empty"><div class="big">📭</div>暂无成交记录</div>';
    return;
  }
  container.innerHTML = latest.map(r => {
    const showListing = r.listing_price_raw && r.listing_price_raw !== String(r.listing_price)

function updateStats() {
  document.getElementById('statTotal').textContent = records.length;
  const now = new Date();
  const thisMonth = records.filter(r => {
    const d = parseDate(r.date);
    return d && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  document.getElementById('statMonth').textContent = thisMonth.length;
  const withPrice = records.filter(r => r.transaction_price);
  if (withPrice.length > 0) {
    document.getElementById('statAvg').textContent = (withPrice.reduce((s, r) => s + r.transaction_price, 0) / withPrice.length).toFixed(1);
  }
  document.getElementById('statUpdated').textContent = records.reduce((s, r) => s + (r.update_count || 0), 0);
}

function parseDate(str) {
  if (!str) return null;
  const m = str.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  return null;
}

// ==================== HISTORY ====================
function showHistory(id) {
  const r = records.find(x => x.id === id);
  if (!r || !r.price_history?.length) return;
  const popup = document.getElementById('historyPopup');
  const content = document.getElementById('historyContent');
  let html = '<p><strong>' + esc(r.building) + '</strong> · 编号: ' + esc(r.property_id) + '</p>';
  html += '<p>当前成交价: <strong style="color:#059669">' + (r.transaction_price_raw || (r.transaction_price ? r.transaction_price + '万' : '--')) + '</strong></p><hr style="margin:8px 0">';
  html += '<table style="width:100%;font-size:.78rem"><thead><tr><th>#</th><th>历史成交价</th><th>时间</th></tr></thead><tbody>';
  r.price_history.forEach((h, i) => {
    html += '<tr><td>' + (i+1) + '</td><td style="color:#dc2626">' + h.price + '</td><td>' + (h.date || h.recordedAt?.slice(0,10) || '--') + '</td></tr>';
  });
  html += '</tbody></table>';
  content.innerHTML = html;
  popup.classList.add('open');
}
function closeHistory() {
  document.getElementById('historyPopup').classList.remove('open');
}

// ==================== EXPORT CSV ====================
function exportCSV() {
  if (records.length === 0) { toast('没有数据可导出', 'warn'); return; }
  const headers = ['房源编号','楼盘','面积(㎡)','装修','维护人','挂牌价','成交价','成交公司','成交时间','更新次数'];
  const rows = records.map(r => [
    r.property_id, r.building, r.area || '', r.decoration, r.maintainer,
    r.listing_price_raw || (r.listing_price ? r.listing_price + '万' : ''),
    r.transaction_price_raw || (r.transaction_price ? r.transaction_price + '万' : ''),
    r.company, r.date, r.update_count || 0
  ]);
  const BOM = '﻿';
  const csv = BOM + [headers, ...rows].map(row =>
    row.map(cell => {
      const str = String(cell ?? '');
      return str.includes(',') || str.includes('"') ? '"' + str.replace(/"/g,'""') + '"' : str;
    }).join(',')
  ).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = '成交数据_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
  toast('已导出 ' + records.length + ' 条记录 → WPS可直接打开', 'success');
}

// ==================== MISC ====================
function switchView(view, btn) {
  document.getElementById('tableView').style.display = view === 'table' ? '' : 'none';
  document.getElementById('cardsView').style.display = view === 'cards' ? '' : 'none';
  document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (view === 'cards') renderCards();
}

function esc(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type || '') + ' show';
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.className = 'toast'; }, 2500);
}
