<script>
(function setupPWA() {
  // 用 Canvas 生成一个绿色建筑图标 PNG
  var canvas = document.createElement('canvas');
  canvas.width = 192; canvas.height = 192;
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = '#059669';
  ctx.beginPath(); ctx.arc(96,96,96,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '100px serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🏠',96,105);

  var iconURL = canvas.toDataURL('image/png');
  var manifest = {
    name: '成交数据管理',
    short_name: '成交数据',
    description: '房产成交数据智能收录工具',
    start_url: location.href,
    display: 'standalone',
    orientation: 'any',
    background_color: '#ffffff',
    theme_color: '#059669',
    icons: [{ src: iconURL, sizes: '192x192', type: 'image/png' }]
  };
  var blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
  var link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
})();
</script>

<script>
// ============================================================
// 本地存储引擎
// ============================================================
const STORAGE_KEY = 'cdsj_records_v31';
let records = [];

function saveToLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
  catch(e) { toast('⚠ 存储空间不足！请导出备份后清理旧数据', 'warn'); }
}
function loadFromLocal() {
  try { const raw = localStorage.getItem(STORAGE_KEY); records = raw ? JSON.parse(raw) : []; }
  catch(e) { records = []; }
}

// ============================================================
// 增强智能解析引擎 v3.1
// 三遍解析：正则匹配 → 自由格式推断 → 行级扫描回退
// ============================================================

// ---- 第一遍：增强正则匹配（50+ 字段别名） ----
const FIELD_PATTERNS = {
  building: [
    /(?:楼盘名称|楼盘地址|项目名称|楼盘播报|楼盘|小区名称|小区|项目|地址)\s*[:：=]\s*(.+)/i,
  ],
  room: [
    /(?:房号|门牌号|房间号|室号|栋号|单元号|楼层)\s*[:：=]\s*(.+)/i,
  ],
  area: [
    /(?:建筑面积|套内面积|面积|建面|平米|平方)\s*[:：=]\s*(.+)/i,
  ],
  decoration: [
    /(?:装修情况|装修程度|装修|装潢)\s*[:：=]\s*(.+)/i,
  ],
  maintainer: [
    /(?:维护人|责任人|经纪人|负责人|管家|联系人|维护)\s*[:：=]\s*(.+)/i,
  ],
  listingPrice: [
    /(?:业主报价|挂牌价格|挂牌价|挂牌|挂价|报价|售价|房东报价)\s*[:：=]\s*(.+)/i,
  ],
  transactionPrice: [
    /(?:最终成交价|实际成交价|签约价格|成交价格|成交价|签约价|成交|总价)\s*[:：=]\s*(.+)/i,
  ],
  company: [
    /(?:签约公司|中介公司|成交公司|平台公司|中介|公司|平台|经纪公司)\s*[:：=]\s*(.+)/i,
  ],
  date: [
    /(?:签约时间|签约日期|成交时间|成交日期|签约|日期|时间)\s*[:：=]\s*(.+)/i,
  ],
  propertyId: [
    /(?:房源编码|房源ID|房源编号|物业编号|房屋编号|房源号|编号|ID)\s*[:：=]\s*(.+)/i,
  ],
};

function extractByRegex(block) {
  const entry = {};
  const confidence = {};  // 标记每个字段的匹配置信度
  for (const [key, patterns] of Object.entries(FIELD_PATTERNS)) {
    for (const re of patterns) {
      const match = block.match(re);
      if (match) {
        entry[key] = match[1].trim();
        confidence[key] = 'exact';  // 精确匹配
        break;
      }
    }
  }
  entry._confidence = confidence;
  return entry;
}

// ---- 第二遍：自由格式智能推断 ----
// 处理没有标签的文本，如 "星澜之城 2-523  54平  138万→122万  贝壳德佑  6.11"
function inferFreeFormat(block) {
  const entry = {};
  const conf = {};

  // 1. 尝试匹配 "楼盘名 房号" 模式
  // 如 "星澜之城2-523" 或 "星澜之城 2-523" 或 "星澜之城2栋523"
  const buildingRoomPatterns = [
    /(?:^|\n|，|。|\s)([一-龥a-zA-Z]+(?:[一-龥a-zA-Z]*))(?:[\s]*)(\d[\d\-\s–—A-Za-z\/]{1,20})/,
  ];

  // 2. 找到面积: 数字后跟 "平" "㎡" "m2" "平米" "平方"
  const areaPattern = /(\d+\.?\d*)\s*(?:平|㎡|m2|平米|平方|sqm)/i;

  // 3. 价格: 数字后跟"万" 或 纯7-8位数字（总价） 或 A万→B万
  const priceArrowPattern = /(\d+\.?\d*)\s*万?\s*[→\->–—]+\s*(\d+\.?\d*)\s*万?/;
  const priceWanPattern = /(\d+\.?\d*)\s*(?:万元|万)/g;
  const priceRawPattern = /(?:^|\s)(\d{3,4})\s*(?:万|元)?(?:$|\s|，|。)/;  // 裸数字价格

  // 4. 日期: 多种格式
  const datePatterns = [
    /(\d{4}[.\-\/]\d{1,2}[.\-\/]\d{1,2})/,
    /(\d{1,2}月\d{1,2}[日号])/,
    /(\d{1,2}[.\-]\d{1,2})(?:$|\s)/,
  ];

  // 5. 公司名: 常见中介公司关键词
  const companyPattern = /(?:贝壳|链家|德佑|我爱我家|中原|21世纪|太平洋|安居客|58|搜房|房天下|麦田|合富|世联|中原地产|美联|Q房|乐有家|裕丰|链家|贝壳德佑|贝壳找房)[一-龥]*/i;

  // 6. 装修: 简装/精装/毛坯/豪装
  const decoPattern = /(毛坯|简装|精装|豪装|中装|清水|拎包入住|全装|半装)/;

  // 7. 房源编号: 纯数字10-15位
  const idPattern = /(?:^|\s)(\d{10,20})(?:\s|$|，|。)/;

  // --- 执行推断 ---
  const text = block;

  // 楼盘+房号：更宽泛的匹配，不强制后缀
  const buildingSuffixes = '(?:城|苑|园|府|郡|湾|庭|筑|庄|邸|寓|居|舍|馆|第|座|区|村|堡|里|岸|湖|山|景|林|岛|院|台|榭|阁|楼|场|中心|广场|天地|新城|花园|公寓|华庭|雅苑|豪庭|名都|花苑|名门|大厦|新苑|佳苑|新村|丽都|丽园|锦园|秀园|福邸|御园|香郡|绿洲|春晓|天成|翠苑|明珠)';
  const brMatch = text.match(new RegExp('([一-龥a-zA-Z]{2,20}' + buildingSuffixes + ')\\s*(\\d[\\d\\-\\s–—A-Za-z\\/\\.]{1,25})?'));
  if (brMatch) {
    entry.building = brMatch[1].trim();
    if (brMatch[2]) { entry.room = brMatch[2].trim(); conf.room = 'inferred'; }
    conf.building = 'inferred';
  }

  // 面积
  const areaMatch = text.match(areaPattern);
  if (areaMatch) { entry.area = areaMatch[1]; conf.area = 'inferred'; }

  // 价格（箭头模式最可靠）
  const arrowMatch = text.match(priceArrowPattern);
  if (arrowMatch) {
    entry.listingPrice = arrowMatch[1];
    entry.transactionPrice = arrowMatch[2];
    conf.listingPrice = 'inferred';
    conf.transactionPrice = 'inferred';
  } else {
    // 找所有万价格（兼容旧浏览器，不用matchAll）
    const allWan = [];
    let mWan;
    while ((mWan = priceWanPattern.exec(text)) !== null) {
      allWan.push(mWan);
    }
    if (allWan.length >= 2) {
      entry.listingPrice = allWan[0][1];
      entry.transactionPrice = allWan[1][1];
      conf.listingPrice = 'inferred';
      conf.transactionPrice = 'inferred';
    } else if (allWan.length === 1) {
      entry.transactionPrice = allWan[0][1];
      conf.transactionPrice = 'inferred';
    }
  }

  // 日期
  for (const dp of datePatterns) {
    const dm = text.match(dp);
    if (dm) { entry.date = dm[1]; conf.date = 'inferred'; break; }
  }

  // 公司
  const compMatch = text.match(companyPattern);
  if (compMatch) { entry.company = compMatch[0]; conf.company = 'inferred'; }

  // 装修
  const decoMatch = text.match(decoPattern);
  if (decoMatch) { entry.decoration = decoMatch[1]; conf.decoration = 'inferred'; }

  // 维护人：中文名2-4字（在无标签的自由文本中较难精准识别，做弱匹配）
  const nameMatch = text.match(/(?:维护人?|经纪|负责|维护)\s*[:：=]?\s*([一-龥]{2,4})/);
  if (nameMatch) { entry.maintainer = nameMatch[1]; conf.maintainer = 'inferred'; }

  // 房源编号
  const idMatch = text.match(idPattern);
  if (idMatch) { entry.propertyId = idMatch[1]; conf.propertyId = 'inferred'; }

  entry._confidence = conf;
  return entry;
}

// ---- 第三遍：行级扫描回退 ----
// 逐行扫描 "关键词 值" 模式
function extractByLines(block) {
  const entry = {};
  const conf = {};
  const lines = block.split(/[\n\r]+/).filter(l => l.trim());
  const knownKeys = {
    '楼盘': 'building', '小区': 'building', '项目': 'building',
    '房号': 'room', '门牌': 'room',
    '面积': 'area', '建面': 'area', '平米': 'area',
    '装修': 'decoration',
    '维护': 'maintainer', '经纪': 'maintainer', '负责': 'maintainer',
    '挂牌': 'listingPrice', '报价': 'listingPrice', '售价': 'listingPrice',
    '成交': 'transactionPrice', '签约': 'transactionPrice',
    '公司': 'company', '中介': 'company', '平台': 'company',
    '时间': 'date', '日期': 'date',
    '编号': 'propertyId', '房源': 'propertyId', 'ID': 'propertyId',
  };

  for (const line of lines) {
    // 尝试 "关键词:值" 或 "关键词：值" 或 "关键词=值" 或 "关键词 值"
    const kvMatch = line.match(/^([一-龥a-zA-Z]{1,6})\s*[:：=]\s*(.+)$/);
    if (kvMatch) {
      const key = kvMatch[1].trim();
      const val = kvMatch[2].trim();
      for (const [kname, field] of Object.entries(knownKeys)) {
        if (key.includes(kname) && !entry[field]) {
          entry[field] = val;
          conf[field] = 'loose';
          break;
        }
      }
    }
  }
  entry._confidence = conf;
  return entry;
}

// ---- 主解析入口：三遍合并 ----
function parseBroadcast(text) {
  const t = text.replace(/：/g, ':');
  // 按 "成交播报" 分块
  const blocks = t.split(/成交播报/i).filter(b => b.trim());
  if (blocks.length === 0 && text.trim()) blocks.push(text);
  const results = [];

  for (const block of blocks) {
    const blockText = block.trim();
    if (!blockText) continue;

    // 三遍解析，后一遍补充前一遍缺失的字段
    const r1 = extractByRegex(blockText);
    const r2 = inferFreeFormat(blockText);
    const r3 = extractByLines(blockText);

    // 合并策略：精确匹配优先，推断补充
    const merged = {};
    const mergedConf = {};
    const allKeys = ['building','room','area','decoration','maintainer','listingPrice','transactionPrice','company','date','propertyId'];

    for (const key of allKeys) {
      // 优先：精确匹配
      if (r1[key] && r1._confidence[key] === 'exact') {
        merged[key] = r1[key];
        mergedConf[key] = 'exact';
      } else if (r2[key] && r2._confidence[key] === 'inferred') {
        merged[key] = r2[key];
        mergedConf[key] = 'inferred';
      } else if (r3[key] && r3._confidence[key] === 'loose') {
        merged[key] = r3[key];
        mergedConf[key] = 'loose';
      } else if (r1[key]) {
        merged[key] = r1[key];
        mergedConf[key] = 'exact';
      } else if (r2[key]) {
        merged[key] = r2[key];
        mergedConf[key] = 'inferred';
      }
    }

    // 智能拆分楼盘+房号 —— 始终清理楼盘名末尾的数字尾巴
    if (merged.building) {
      const splitPatterns = [
        // "星澜之城2-523" / "星澜之城 2-523" / "星澜之城16-3-202"
        /^(.+?)\s*(\d[\d\-\s–—\.\/A-Za-z]{1,25})$/,
        // "星澜之城2栋523" / "星澜之城16栋3-202"
        /^(.+?)(\d+栋[\d\-\s–—\.\/A-Za-z]*)$/,
        // "金沙湖畔7幢1102"
        /^(.+?)(\d+幢[\d\-\s–—\.\/A-Za-z]*)$/,
        // "某某苑3单元502"
        /^(.+?)(\d+单元[\d\-\s–—\.\/A-Za-z]*)$/,
        // "某某城A区16-3-202"
        /^(.+?[区苑园府郡湾庭筑庄邸寓馆座村堡里岸湖山景林岛院台阁楼场])\s*(\d[\d\-\s–—\.\/A-Za-z]{1,25})$/,
      ];
      for (const p of splitPatterns) {
        const m = merged.building.match(p);
        if (m) {
          const cleanBuilding = m[1].trim();
          const extractedRoom = m[2].trim();
          // 如果已有显式房号，用它；否则用拆分出来的
          if (!merged.room) {
            merged.room = extractedRoom;
            mergedConf.room = mergedConf.room || 'inferred';
          }
          // 始终清理楼盘名
          merged.building = cleanBuilding;
          break;
        }
      }
    }

    merged._confidence = mergedConf;
    if (merged.propertyId || merged.building) results.push(merged);
  }

  return results;
}

// ---- 智能数值提取 ----
function extractNum(str) {
  if (!str) return null;
  const cleaned = str.replace(/[^0-9.]/g, '');
  const num = parseFloat(cleaned);
  return isNaN(num) ? null : num;
}

// 规范化价格（处理 "138万" "138万元" "1380000" "1.38百万"等）
function normalizePrice(str) {
  if (!str) return null;
  const original = str.trim();

  // "138万" / "138万元"
  let m = original.match(/^(\d+\.?\d*)\s*(?:万元|万)/);
  if (m) return parseFloat(m[1]);

  // "1.38百万"
  m = original.match(/^(\d+\.?\d*)\s*百万/);
  if (m) return parseFloat(m[1]) * 100;

  // "1380000" or "1380000元" → 自动转万
  m = original.match(/^(\d{6,8})(?:元)?$/);
  if (m) {
    const raw = parseInt(m[1]);
    if (raw >= 1000000) return raw / 10000;
    return raw;
  }

  return extractNum(original);
}

// ---- 智能日期解析 ----
function parseDate(str) {
  if (!str) return null;
  // 2026.6.11 / 2026-06-11 / 2026/6/11
  let m = str.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);

  // 6月11日 / 6月11号
  m = str.match(/(\d{1,2})月(\d{1,2})[日号]/);
  if (m) return new Date(new Date().getFullYear(), +m[1] - 1, +m[2]);

  // 5.31 / 5-31 (无年份，当年)
  m = str.match(/^(\d{1,2})[.\-](\d{1,2})$/);
  if (m) return new Date(new Date().getFullYear(), +m[1] - 1, +m[2]);

  return null;
}

// ---- 评估解析质量 ----
function assessQuality(entry) {
  const conf = entry._confidence || {};
  const exact = Object.values(conf).filter(v => v === 'exact').length;
  const inferred = Object.values(conf).filter(v => v === 'inferred' || v === 'loose').length;
  if (exact >= 5) return 'good';     // 大部分精确匹配
  if (exact + inferred >= 4) return 'partial';  // 尚可
  return 'poor';  // 识别较少，可能需人工检查
}

// ============================================================
// 录入逻辑
// ============================================================
function parseAndSave() {
  const btn = document.getElementById('btnParse');
  const log = document.getElementById('parseLog');
  const input = document.getElementById('pasteInput').value.trim();
  if (!input) { toast('请先粘贴成交播报文本', 'warn'); return; }

  const parsed = parseBroadcast(input);
  log.style.display = 'block';

  if (parsed.length === 0) {
    log.innerHTML = '<span style="color:#b91c1c">❌ 未识别到成交数据</span><br>请确认包含「楼盘」或「房源编号」信息<br>支持格式：<br>  1. 标签格式：楼盘:xxx / 成交价:xxx<br>  2. 简单格式：楼盘名 房号 面积 价格<br>  3. 混合文本自动提取';
    toast('未识别到数据，请检查格式', 'warn');
    return;
  }

  // 统计质量
  const qualityCounts = { good: 0, partial: 0, poor: 0 };
  parsed.forEach(p => { qualityCounts[assessQuality(p)]++; });

  let logHtml = '📋 识别到 <b>' + parsed.length + '</b> 条数据';
  if (qualityCounts.good > 0) logHtml += '  <span class="parse-quality good">✓ 精确识别 ' + qualityCounts.good + ' 条</span>';
  if (qualityCounts.partial > 0) logHtml += '  <span class="parse-quality partial">△ 推断识别 ' + qualityCounts.partial + ' 条</span>';
  logHtml += '<br>';

  parsed.forEach((p, i) => {
    const q = assessQuality(p);
    const qIcon = q === 'good' ? '✓' : q === 'partial' ? '△' : '?';
    logHtml += '  <br>[' + (i+1) + '] ' + qIcon + ' 楼盘=' + (p.building || '?') + ' | 编号=' + (p.propertyId || '?') + ' | 成交价=' + (p.transactionPrice || '?');
  });

  log.innerHTML = logHtml;

  btn.disabled = true;
  btn.textContent = '⏳ 录入中...';

  let newCount = 0, updateCount = 0;
  const now = new Date().toISOString();

  for (const entry of parsed) {
    const area = extractNum(entry.area);
    const listingPrice = normalizePrice(entry.listingPrice);
    const transactionPrice = normalizePrice(entry.transactionPrice);
    const listingPriceRaw = entry.listingPrice || null;
    const transactionPriceRaw = entry.transactionPrice || null;

    // 去重：优先房源编号，其次 楼盘+房号 组合
    let existingIdx = -1;
    if (entry.propertyId) {
      existingIdx = records.findIndex(r => r.property_id === entry.propertyId);
    }
    if (existingIdx < 0 && entry.building) {
      existingIdx = records.findIndex(r =>
        r.building === entry.building && r.room === (entry.room || '') && !entry.propertyId
      );
    }

    if (existingIdx >= 0) {
      const existing = records[existingIdx];
      // 只有成交价真正变了才记录历史
      const priceChanged = transactionPrice !== null && existing.transaction_price !== transactionPrice;
      let priceHistory = existing.price_history || [];
      if (priceChanged) {
        priceHistory.push({
          price: existing.transaction_price_raw || (existing.transaction_price ? existing.transaction_price + '万' : ''),
          date: existing.date,
          recordedAt: existing.updated_at || existing.created_at
        });
      }
      records[existingIdx] = {
        id: existing.id,
        property_id: entry.propertyId || existing.property_id,
        building: entry.building || existing.building,
        room: entry.room || existing.room || '',
        area: area || existing.area,
        decoration: entry.decoration || existing.decoration || '',
        maintainer: entry.maintainer || existing.maintainer || '',
        listing_price: listingPrice || existing.listing_price,
        listing_price_raw: listingPriceRaw || existing.listing_price_raw,
        transaction_price: transactionPrice || existing.transaction_price,
        transaction_price_raw: transactionPriceRaw || existing.transaction_price_raw,
        company: entry.company || existing.company || '',
        date: entry.date || existing.date || '',
        price_history: priceHistory,
        update_count: priceChanged ? (existing.update_count || 0) + 1 : (existing.update_count || 0),
        created_at: existing.created_at,
        updated_at: now
      };
      // 价格没变 → 不算更新，静默合并
      if (priceChanged) updateCount++;
    } else {
      const record = {
        id: 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        property_id: entry.propertyId || '',
        building: entry.building || '',
        room: entry.room || '',
        area: area || null,
        decoration: entry.decoration || '',
        maintainer: entry.maintainer || '',
        listing_price: listingPrice || null,
        listing_price_raw: listingPriceRaw || null,
        transaction_price: transactionPrice || null,
        transaction_price_raw: transactionPriceRaw || null,
        company: entry.company || '',
        date: entry.date || '',
        price_history: [],
        update_count: 0,
        created_at: now,
        updated_at: now
      };
      records.push(record);
      newCount++;
    }
  }

  saveToLocal();
  document.getElementById('pasteInput').value = '';
  renderAll();

  const msg = [];
  if (newCount) msg.push('新增 ' + newCount + ' 条');
  if (updateCount) msg.push('更新 ' + updateCount + ' 条');
  log.innerHTML += '<br>✅ 完成！' + (msg.length ? msg.join('，') : '无变化');
  if (msg.length) toast(msg.join('，') + ' → 已保存到本地 💾', 'success');

  btn.disabled = false;
  btn.textContent = '🔍 智能解析并录入';
}

// ============================================================

function deleteRecord(recordId) {
  if (!confirm('确定删除该条成交记录？此操作不可恢复！')) return;
  records = records.filter(r => r.id !== recordId);
  saveToLocal();
  renderAll();
  toast('已删除', 'warn');
}

// ============================================================
// 渲染
// ============================================================
function getFiltered() {
  const q = (document.getElementById('searchInput')?.value || '').trim().toLowerCase();
  if (!q) return records;
  return records.filter(r =>
    (r.building || '').toLowerCase().includes(q) ||
    (r.property_id || '').toLowerCase().includes(q) ||
    (r.maintainer || '').toLowerCase().includes(q) ||
    (r.company || '').toLowerCase().includes(q) ||
    (r.room || '').toLowerCase().includes(q)
  );
}

function renderAll() {
  renderTable();
  renderBroadcasts();
  renderCards();
  updateStats();
}

function renderTable() {
  const filtered = getFiltered();
  const tbody = document.getElementById('tableBody');
  document.getElementById('resultCount').textContent = '共 ' + filtered.length + ' 条';

    tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:40px;color:var(--text2)">暂无数据，请在左侧粘贴成交播报</td></tr>';

    const updateBadge = r.update_count > 0 ? '<span class="tag-duplicate">更新' + r.update_count + '次</span>' : '';
    const showListing = r.listing_price_raw || (r.listing_price ? r.listing_price + '万' : '--');
    const showTransaction = r.transaction_price_raw || (r.transaction_price ? r.transaction_price + '万' : '--');

      '<td>' + esc(r.decoration || '--') + '</td>' +
      '<td>' + esc(r.maintainer || '--') + '</td>' +
      '<td>' + (showListing !== '--' ? '<span style="color:var(--text2)">' + showListing + '</span>' : '--') + '</td>' +
      '<td><strong style="color:#059669">' + showTransaction + '</strong>' + updateBadge + '</td>' +
      '<td>' + esc(r.company || '--') + '</td>' +
      '<td>' + esc(r.date || '--') + '</td>' +
      '<td style="display:flex;gap:4px">' +

        '<button class="btn btn-sm btn-danger" onclick="deleteRecord(\'' + esc(r.id) + '\')">✕</button>' +
      '</td></tr>';
  }).join('');
}

function updateStats() {
  document.getElementById('statTotal').textContent = records.length;
  const now = new Date();
  const thisMonth = records.filter(r => {
    const d = parseDate(r.date);
    return d && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  document.getElementById('statMonth').textContent = thisMonth.length;
  const withPrice = records.filter(r => r.transaction_price);
  if (withPrice.length > 0) {
    document.getElementById('statAvg').textContent = (withPrice.reduce((s, r) => s + r.transaction_price, 0) / withPrice.length).toFixed(1);
  }
  document.getElementById('statUpdated').textContent = records.reduce((s, r) => s + (r.update_count || 0), 0);
}

// ============================================================
// 价格历史
// ============================================================
function showHistory(id) {
  const r = records.find(x => x.id === id);
  if (!r || !r.price_history?.length) return;
  const popup = document.getElementById('historyPopup');
  const content = document.getElementById('historyContent');
  let html = '<p><strong>' + esc(r.building) + '</strong> · 编号: ' + esc(r.property_id) + '</p>';
  html += '<p>当前成交价: <strong style="color:#059669">' + (r.transaction_price_raw || (r.transaction_price ? r.transaction_price + '万' : '--')) + '</strong></p><hr style="margin:8px 0">';
  html += '<table style="width:100%;font-size:.78rem"><thead><tr><th>#</th><th>历史成交价</th><th>时间</th></tr></thead><tbody>';
  r.price_history.forEach((h, i) => {
    html += '<tr><td>' + (i+1) + '</td><td style="color:#dc2626">' + h.price + '</td><td>' + (h.date || h.recordedAt?.slice(0,10) || '--') + '</td></tr>';
  });
  html += '</tbody></table>';
  content.innerHTML = html;
  popup.classList.add('open');
}
function closeHistory() {

// ============================================================
// CSV 导出（WPS兼容，UTF-8 BOM）
// ============================================================
function exportCSV() {
  if (records.length === 0) { toast('没有数据可导出', 'warn'); return; }
  const headers = ['房源编号','楼盘','房号','面积(㎡)','装修','维护人','挂牌价','成交价','成交公司','成交时间','更新次数'];
  const rows = records.map(r => [
    r.property_id, r.building, r.room || '', r.area || '', r.decoration, r.maintainer,
    r.listing_price_raw || (r.listing_price ? r.listing_price + '万' : ''),
    r.transaction_price_raw || (r.transaction_price ? r.transaction_price + '万' : ''),
    r.company, r.date, r.update_count || 0
  ]);
  const BOM = '﻿';
  const csv = BOM + [headers, ...rows].map(row =>
    row.map(cell => {
      const str = String(cell ?? '');
      return str.includes(',') || str.includes('"') ? '"' + str.replace(/"/g,'""') + '"' : str;
    }).join(',')
  ).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = '成交数据_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click(); URL.revokeObjectURL(url);
  toast('✅ 已导出 ' + records.length + ' 条记录 → WPS/Excel可直接打开', 'success');
}

// ============================================================
// JSON 备份/恢复
// ============================================================
function backupData() {
  if (records.length === 0) { toast('没有数据可备份', 'warn'); return; }
  const backup = {
    version: '3.1',
    exportedAt: new Date().toISOString(),
    total: records.length,
    records: records
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = '成交数据_备份_' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(url);
  toast('💾 已备份 ' + records.length + ' 条记录到JSON文件', 'success');
}

function restoreData(inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const backup = JSON.parse(e.target.result);
      const importedRecords = backup.records || backup;
      if (!Array.isArray(importedRecords)) { toast('❌ 备份文件格式错误', 'warn'); return; }
      if (records.length > 0) {
        if (!confirm('当前有 ' + records.length + ' 条数据。\n\n"确定" = 合并导入（同编号覆盖）\n"取消" = 放弃导入')) { inputEl.value = ''; return; }
      }
      for (const item of importedRecords) {
        const idx = records.findIndex(r => r.property_id && r.property_id === item.property_id);
        if (idx >= 0) { records[idx] = item; } else { records.push(item); }
      }
      saveToLocal(); renderAll();
      toast('✅ 已导入 ' + importedRecords.length + ' 条记录', 'success');
    } catch(err) { toast('❌ 文件解析失败: ' + err.message, 'warn'); }
  };
  reader.readAsText(file, 'utf-8');
  inputEl.value = '';
}

// ============================================================
// CSV 导入
// ============================================================
function handleCSVImport(inputEl) {
  const file = inputEl.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const text = e.target.result;
      const lines = text.split('\n').filter(l => l.trim());
      if (lines.length < 2) { toast('❌ CSV文件内容为空', 'warn'); inputEl.value = ''; return; }
      const headerLine = lines[0].replace(/^﻿/, '');
      const headers = parseCSVLine(headerLine);
      const now = new Date().toISOString();
      let imported = 0;

      for (let i = 1; i < lines.length; i++) {
        const cells = parseCSVLine(lines[i]);
        if (cells.length === 0) continue;
        const getCell = (name) => {
          const idx = headers.findIndex(h => h.includes(name));
          return idx >= 0 ? (cells[idx] || '').trim() : '';
        };
        const propertyId = getCell('房源编号');
        if (!propertyId) continue;

        const record = {
          id: 'csv_' + Date.now() + '_' + i,
          property_id: propertyId,
          building: getCell('楼盘'), room: getCell('房号'),
          area: extractNum(getCell('面积')),
          decoration: getCell('装修'), maintainer: getCell('维护人'),
          listing_price: normalizePrice(getCell('挂牌价')),
          listing_price_raw: getCell('挂牌价') || null,
          transaction_price: normalizePrice(getCell('成交价')),
          transaction_price_raw: getCell('成交价') || null,
          company: getCell('成交公司'), date: getCell('成交时间'),
          price_history: [], update_count: parseInt(getCell('更新次数')) || 0,
          created_at: now, updated_at: now
        };
        const existingIdx = records.findIndex(r => r.property_id === propertyId);
        if (existingIdx >= 0) {
          record.id = records[existingIdx].id;
          record.created_at = records[existingIdx].created_at;
          record.price_history = records[existingIdx].price_history || [];
          records[existingIdx] = record;
        } else { records.push(record); }
        imported++;
      }
      saveToLocal(); renderAll();
      toast('✅ 已从CSV导入 ' + imported + ' 条记录', 'success');
    } catch(err) { toast('❌ CSV解析失败: ' + err.message, 'warn'); }
  };
  reader.readAsText(file, 'utf-8');
  inputEl.value = '';
}

function parseCSVLine(line) {
  const result = []; let current = ''; let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"') {
        if (i + 1 < line.length && line[i + 1] === '"') { current += '"'; i++; }
        else { inQuotes = false; }
      } else { current += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { result.push(current); current = ''; }
      else { current += ch; }
    }
  }
  result.push(current);
  return result;
}

function esc(str) {
  if (!str) return '';
  const div = document.createElement('div');

}

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type || '') + ' show';
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.className = 'toast'; }, 2500);
}

  const isiOS = /iPhone|iPad|iPod/i.test(ua);
